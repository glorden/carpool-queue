<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carpool Queue — история заказов</title>
    <link rel="icon" type="image/png" href="/static/favicon-32x32.png">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <h1>История заказов</h1>
    </header>

    <nav id="site-nav" class="site-nav"></nav>

    <main>
        <section id="filters-section">
            <label for="filter-status">Статус:</label>
            <select id="filter-status">
                <option value="">Все</option>
                <option value="pending">Ожидает</option>
                <option value="assigned">Назначен</option>
                <option value="completed">Завершён</option>
                <option value="cancelled">Отменён</option>
            </select>

            <label for="filter-user">Исполнитель:</label>
            <select id="filter-user">
                <option value="">Все</option>
            </select>

            <button id="apply-filters">Применить</button>
        </section>

        <section id="history-section">
            <div class="table-scroll">
            <table id="history-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Маршрут</th>
                        <th>Комментарий</th>
                        <th>Статус</th>
                        <th>Исполнитель</th>
                        <th>Создан</th>
                        <th>Завершён</th>
                    </tr>
                </thead>
                <tbody id="history-tbody">
                    <tr>
                        <td colspan="7">Загрузка...</td>
                    </tr>
                </tbody>
            </table>
            </div>
        </section>
    </main>

    <script src="/static/js/nav.js"></script>
    <script src="/static/js/history.js"></script>
</body>
</html>
