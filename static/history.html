<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>История заказов</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/fav/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/fav/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/fav/apple-touch-icon.png">
    <link rel="icon" href="/static/fav/favicon.ico">
    <link rel="manifest" href="/static/fav/site.webmanifest">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <h1>История заказов</h1>
    </header>

    <div id="site-user" class="site-user"></div>

    <nav id="site-nav" class="site-nav"></nav>

    <main>
        <div id="login-prompt" class="login-prompt" hidden>
            <p>Войдите через VK, чтобы видеть историю заказов.</p>
        </div>

        <div id="auth-gated" hidden>
        <section id="filters-section">
            <label for="filter-status">Статус:</label>
            <select id="filter-status">
                <option value="">Все</option>
                <option value="pending">Ожидает</option>
                <option value="assigned">Назначен</option>
                <option value="completed">Завершён</option>
                <option value="cancelled">Отменён</option>
            </select>

            <label for="filter-queue-type">Тип:</label>
            <select id="filter-queue-type">
                <option value="">Все</option>
                <option value="long">Дальний</option>
                <option value="short">Короткий</option>
            </select>

            <label for="filter-user">Исполнитель:</label>
            <select id="filter-user">
                <option value="">Все</option>
            </select>

            <button id="apply-filters">Применить</button>
        </section>

        <section id="history-section">
            <div class="table-scroll">
            <table id="history-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Тип</th>
                        <th>Маршрут</th>
                        <th>Комментарий</th>
                        <th>Статус</th>
                        <th>Исполнитель</th>
                        <th>Создан</th>
                        <th>Завершён</th>
                        <th>Причина самоназначения</th>
                    </tr>
                </thead>
                <tbody id="history-tbody">
                    <tr>
                        <td colspan="9">Загрузка...</td>
                    </tr>
                </tbody>
            </table>
            </div>
        </section>
        </div>
    </main>

    <script src="/static/js/nav.js"></script>
    <script src="/static/js/session.js"></script>
    <script src="/static/js/history.js"></script>
</body>
</html>
