<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Прайс</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/fav/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/fav/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/fav/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Прайс">
    <link rel="icon" href="/static/fav/favicon.ico">
    <link rel="manifest" href="/static/fav/price.webmanifest">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <h1>Прайс</h1>
    </header>

    <div id="site-user" class="site-user"></div>

    <nav id="site-nav" class="site-nav"></nav>

    <div id="install-prompt" class="install-prompt" hidden></div>

    <main>
        <div id="login-prompt" class="login-prompt" hidden>
            <p>Войдите через VK, чтобы видеть прайс.</p>
        </div>

        <div id="auth-gated" hidden>
        <div class="price-search-wrap">
            <input type="text" id="price-search" placeholder="Поиск" autocomplete="off">
        </div>
        <p id="price-no-results" class="price-note" style="display: none;">Ничего не найдено</p>

        <section class="price-section" data-category="tour">
            <h2>Туры (туда/обратно + ожидание)</h2>
            <ul class="price-list" id="price-list-tour"></ul>
            <form class="price-add-form" data-category="tour">
                <input type="text" class="price-add-name" placeholder="Название" required>
                <input type="text" class="price-add-price" placeholder="Цена" required>
                <button type="submit">Добавить</button>
            </form>
        </section>

        <section class="price-section" data-category="direction">
            <h2>Направления (в одну сторону)</h2>
            <ul class="price-list" id="price-list-direction"></ul>
            <form class="price-add-form" data-category="direction">
                <input type="text" class="price-add-name" placeholder="Название" required>
                <input type="text" class="price-add-price" placeholder="Цена" required>
                <button type="submit">Добавить</button>
            </form>
        </section>

        <section class="price-section" data-category="business">
            <h2>Бизнес-класс</h2>
            <ul class="price-list" id="price-list-business"></ul>
            <form class="price-add-form" data-category="business">
                <input type="text" class="price-add-name" placeholder="Название" required>
                <input type="text" class="price-add-price" placeholder="Цена" required>
                <button type="submit">Добавить</button>
            </form>
        </section>

        <section class="price-section" data-category="minivan">
            <h2>Минивэны</h2>
            <ul class="price-list" id="price-list-minivan"></ul>
            <form class="price-add-form" data-category="minivan">
                <input type="text" class="price-add-name" placeholder="Название" required>
                <input type="text" class="price-add-price" placeholder="Цена" required>
                <button type="submit">Добавить</button>
            </form>
        </section>

        <details class="price-log">
            <summary>История изменений</summary>
            <ul id="price-log-list" class="price-log-list">
                <li>Загрузка...</li>
            </ul>
        </details>
        </div>
    </main>

    <script src="/static/js/nav.js"></script>
    <script src="/static/js/session.js"></script>
    <script src="/static/js/install.js"></script>
    <script src="/static/js/price.js"></script>
</body>
</html>
