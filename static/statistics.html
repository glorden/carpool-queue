<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Статистика</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/fav/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/fav/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/fav/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Очередь">
    <link rel="icon" href="/static/fav/favicon.ico">
    <link rel="manifest" href="/static/fav/site.webmanifest">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <h1>Статистика</h1>
    </header>

    <div id="site-user" class="site-user"></div>

    <nav id="site-nav" class="site-nav"></nav>

    <div id="install-prompt" class="install-prompt" hidden></div>

    <main>
        <div id="login-prompt" class="login-prompt" hidden>
            <p>Войдите через VK, чтобы видеть статистику.</p>
        </div>

        <div id="auth-gated" hidden>
        <section id="overview-section">
            <h2>Общая статистика</h2>
            <ul id="overview-list">
                <li>Загрузка...</li>
            </ul>
        </section>

        <section id="driver-stats-section">
            <h2>Статистика по водителям</h2>
            <div class="table-scroll">
            <table id="driver-stats-table">
                <thead>
                    <tr>
                        <th>Водитель</th>
                        <th>Получено</th>
                        <th>Завершено</th>
                        <th>Отменено</th>
                    </tr>
                </thead>
                <tbody id="driver-stats-tbody">
                    <tr>
                        <td colspan="4">Загрузка...</td>
                    </tr>
                </tbody>
            </table>
            </div>
        </section>
        </div>
    </main>

    <script src="/static/js/nav.js"></script>
    <script src="/static/js/session.js"></script>
    <script src="/static/js/install.js"></script>
    <script src="/static/js/statistics.js"></script>
</body>
</html>
