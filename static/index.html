<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Очередь заказов</title>
    <link rel="icon" type="image/png" href="/static/favicon-32x32.png">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <h1>Очередь заказов</h1>

        <div class="user-selector">
            <label for="current-user">Выберите себя:</label>
            <select id="current-user">
                <option value="">— Выберите —</option>
            </select>
        </div>
    </header>

    <nav id="site-nav" class="site-nav"></nav>

    <main>
        <section id="queue-section">
            <h2>Очередь</h2>
            <ol id="queue-list">
                <li>Загрузка...</li>
            </ol>
        </section>

        <section id="pending-section">
            <h2>Заказы, ожидающие ответа</h2>
            <ul id="pending-list">
                <li>Загрузка...</li>
            </ul>
        </section>

        <section id="my-orders-section">
            <h2>Мои заказы в пути</h2>
            <ul id="my-orders-list">
                <li>Загрузка...</li>
            </ul>
        </section>

        <section id="create-order-section">
            <h2>Создать заказ</h2>

            <form id="create-order-form">
                <div>
                    <label for="route">Маршрут:</label>
                    <input
                        type="text"
                        id="route"
                        name="route"
                        placeholder="Например: Санкт-Петербург — Тверь"
                    >
                    <span id="route-latin-warning" class="hint-warning" hidden>
                        Похоже, маршрут набран латиницей — в уведомлении VK он попадёт как есть. Проверьте раскладку.
                    </span>
                </div>

                <div>
                    <label for="comment">Комментарий:</label>
                    <input
                        type="text"
                        id="comment"
                        name="comment"
                        placeholder="Например: выезд утром, 2 пассажира"
                    >
                </div>

                <button type="submit">Создать заказ</button>
            </form>

            <p id="create-order-status"></p>
        </section>
    </main>

    <script src="/static/js/nav.js"></script>
    <script src="/static/js/dashboard.js"></script>
</body>
</html>
