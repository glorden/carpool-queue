<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Carpool Queue — дэшборд</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <h1>Carpool Queue</h1>
        <div class="user-selector">
            <label for="current-user">Кто я:</label>
            <select id="current-user">
                <option value="">— выбери —</option>
            </select>
        </div>
		<a href="/static/history.html">История заказов →</a>
    </header>

    <main>
        <section id="queue-section">
            <h2>Очередь</h2>
            <ol id="queue-list">
                <li>Загрузка...</li>
            </ol>
        </section>
		<section id="pending-section">
    <h2>Активные предложения</h2>
    <ul id="pending-list">
        <li>Загрузка...</li>
    </ul>
</section>
<section id="my-orders-section">
    <h2>Мои заказы в пути</h2>
    <ul id="my-orders-list">
        <li>Загрузка...</li>
    </ul>
</section>
<section id="create-order-section">
    <h2>Создать заказ</h2>
    <form id="create-order-form">
        <div>
            <label for="route">Маршрут:</label>
            <input type="text" id="route" name="route" placeholder="Например: СПБ - Тверь">
        </div>
        <div>
            <label for="comment">Комментарий:</label>
            <input type="text" id="comment" name="comment" placeholder="Например: выезд утром">
        </div>
        <button type="submit">Создать заказ</button>
    </form>
    <p id="create-order-status"></p>
</section>
    </main>

    <script src="/static/js/dashboard.js"></script>
</body>
</html>
